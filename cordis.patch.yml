# dsh-archived-session-cleaner 组合包 patch（dsh.bundle.patch 指向本文件）：
# 把插件行插入进程内的 web roster，安装后无需再手改 profile 的 cordis.patch.yml。
- insert:
    - id: session-cleaner
      name: dsh-archived-session-cleaner
      inject:
        - webServer
        - workspaceRegistry
        - sessions
        - sessionPersistence